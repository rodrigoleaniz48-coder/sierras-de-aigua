<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo verde salvia con corners redondeados (safe zone maskable) -->
  <rect width="512" height="512" rx="96" fill="#829378"/>
  <!-- Silueta estilizada del galpón: tejado inclinado + 2 ventanas + arco -->
  <g fill="#ffffff" transform="translate(72,150)">
    <!-- Base con pasto (elipse curvada) -->
    <ellipse cx="184" cy="205" rx="176" ry="18"/>
    <!-- Cuerpo del galpón: polígono con tejado inclinado -->
    <path d="M 20 200 L 20 100 L 172 30 L 320 60 L 348 200 Z"/>
    <!-- Recortes negativos (fondo verde asomando) -->
    <g fill="#829378">
      <!-- Ventana izquierda alta -->
      <rect x="60" y="115" width="30" height="70"/>
      <!-- Ventana centro -->
      <rect x="112" y="115" width="30" height="70"/>
      <!-- Arco (puerta grande a la derecha) -->
      <path d="M 200 200 L 200 130 Q 258 90 316 130 L 316 200 Z"/>
      <!-- Detalle del ángulo del tejado -->
      <path d="M 172 45 L 200 30 L 200 55 Z"/>
    </g>
    <!-- Pastito -->
    <path d="M 40 195 L 30 175 L 35 175 L 40 190 L 45 175 L 50 175 Z"/>
    <path d="M 330 195 L 322 175 L 327 175 L 332 190 L 337 175 L 342 175 Z"/>
  </g>
</svg>
